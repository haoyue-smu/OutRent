<style>
  .screen[data-page="17-hub-pickup"] {

    display: flex;

    overflow: hidden;

  #scroller {

  }

  .segmented { position: relative; isolation: isolate; }
  .segmented::before {
    content: "";

    z-index: 0;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc((100% - 12px) / 2);
    border-radius: var(--r-tile);
    background: var(--sage-tint);

    height: var(--touch);

  .map-head { display: flex; align-items: end; justify-content: space-between; gap: var(--s-3); }

    color: var(--sage);
    font-size: var(--fs-callout);
    line-height: var(--lh-callout);

  .map {

    border: 1px solid var(--line);

  .map-placeholder { height: 228px; }
  .map.is-expanded {
    position: fixed;
    top: var(--preview-top);
    left: var(--preview-left);
    z-index: 50;
    width: var(--preview-width);
    height: var(--preview-height);
    border-color: transparent;
    box-shadow: 0 18px 44px #1e2e3b38;
  }
  .map.is-expanded.is-ready {

    left: var(--phone-left);
    width: var(--phone-width);
    height: var(--phone-height);
    border-radius: 0;
    box-shadow: none;
  }
  .map-backdrop {
    position: fixed;
    top: var(--phone-top);
    left: var(--phone-left);
    width: var(--phone-width);
    height: var(--phone-height);
    z-index: 49;
    background: #1e2e3b30;
    opacity: 0;
    pointer-events: none;
  }
  .map-backdrop.is-visible { opacity: 1; }
  .map-canvas { position: absolute; inset: 0; overflow: hidden; }
  .map.is-expanded .map-canvas { cursor: grab; touch-action: none; }
  .map-canvas.is-dragging { cursor: grabbing; }
  .map-canvas:focus-visible { outline: 2px solid #4285f4; outline-offset: -2px; }
  .map-scene {
    position: absolute;
    top: 0;
    left: 0;
    width: 900px;
    height: 1700px;
    transform-origin: top left;
    transform: translate3d(var(--pan-x, -150px), var(--pan-y, -260px), 0) scale(var(--map-zoom, .72));
  }
  .map-art { display: block; width: 100%; height: 100%; overflow: visible; }
  .location-dot {
    position: absolute;
    left: 405px;
    top: 525px;
    width: 26px;
    height: 26px;
    border: 4px solid #fff;
    border-radius: 50%;
    background: #4285f4;
    box-shadow: 0 0 0 18px #4285f426, 0 2px 8px #33557755;
    pointer-events: none;
  }
  .map-recenter {
    position: absolute;
    z-index: 8;
    right: 12px;
    bottom: 12px;
    width: 48px;
    height: 48px;
    display: none;
    place-items: center;
    padding: 0;
    border: 1px solid #d8e0e6;
    border-radius: 15px;
    background: #fff;
    color: #3979d6;
    box-shadow: 0 3px 12px #233b4d29;
    cursor: pointer;
  }
  .map-recenter:focus-visible { outline: 2px solid #4285f4; outline-offset: 2px; }
  .map-recenter svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .map.is-expanded .map-recenter { display: grid; right: 16px; bottom: 112px; opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(10px) scale(.92); }
  .map.is-expanded.is-ready .map-recenter { opacity: 1; visibility: visible; pointer-events: auto; transform: none; }
  .map.is-returning .map-recenter { opacity: 0; visibility: hidden; transform: translateY(8px); pointer-events: none; }
  .map-pin {
    position: absolute;
    z-index: 2;
    width: 64px;
    height: 64px;
    padding: 0;
    border: 0;
    border-radius: var(--r-pill);
    background: transparent;
    color: var(--sage-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .pin-shape {
    width: 44px;
    height: 44px;
    border-radius: var(--r-pill) var(--r-pill) var(--r-pill) 4px;
    background: var(--sage);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-45deg) scale(1);
  }
  .pin-letter {
    transform: rotate(45deg);
    font-size: var(--fs-title);
    line-height: var(--lh-title);
    font-weight: 700;
  }
  .map-pin:focus-visible,
  .map-pin.is-preview,
  .map-pin[aria-pressed="true"] { z-index: 5; }
  .map-pin:focus-visible .pin-shape,

  .map-pin[aria-pressed="true"] .pin-shape {

  }

  .pin-b { left: 465px; top: 590px; }
  .pin-c { left: 530px; top: 480px; }
  .fullscreen-map {
    position: fixed;
    top: var(--phone-top);
    left: var(--phone-left);
    width: var(--phone-width);
    height: var(--phone-height);
    z-index: 51;
    opacity: 0;
    pointer-events: none;
  }
  .fullscreen-map.is-open { opacity: 1; }
  .fullscreen-map-head {
    position: absolute;
    z-index: 2;
    top: max(var(--top-safe), env(safe-area-inset-top));
    right: var(--s-4);
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-pill);
    background: var(--white);
    box-shadow: var(--shadow-float);
    pointer-events: auto;
  }
  .fullscreen-map-head > span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .fullscreen-map-racks {
    position: absolute;
    z-index: 2;
    left: var(--s-4);
    right: var(--s-4);
    bottom: max(var(--s-4), env(safe-area-inset-bottom));
    display: flex;
    gap: var(--s-2);
    overflow-x: auto;
    padding: 2px;
    scrollbar-width: none;
    pointer-events: auto;
  }
  .fullscreen-map-racks::-webkit-scrollbar { display: none; }
  .fullscreen-rack {
    flex: 0 0 152px;
    min-height: 72px;
    border: 2px solid var(--white);
    border-radius: var(--r-card);
    background: var(--white);
    box-shadow: var(--shadow-float);
    padding: var(--s-2);
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;

  .fullscreen-rack:focus-visible { background: var(--sage-tint); transform: translateY(-2px); }
  .fullscreen-rack[aria-pressed="true"] { border-color: var(--sage); }

  .fullscreen-rack .meta { font-size: var(--fs-foot); line-height: var(--lh-foot); color: var(--muted); }
  .rack-list {
    margin: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    background: var(--white);
    overflow: hidden;
  }
  .rack-option {
    width: 100%;
    min-height: 56px;
    padding: var(--s-2) var(--s-3);
    border: 0;
    border-bottom: 1px solid var(--line);
    background: var(--white);
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--s-3);
    text-align: left;
    cursor: pointer;
  }
  .rack-option:last-child { border-bottom: 0; }
  .rack-option:focus-visible { background: var(--mist); }
  .rack-option[aria-pressed="true"] { position: relative; background: var(--mist); }
  .rack-option[aria-pressed="true"]::before {
    content: "";
    position: absolute;
    left: 0;
    top: var(--s-2);
    bottom: var(--s-2);
    width: 4px;
    border-radius: 0 var(--r-pill) var(--r-pill) 0;
    background: var(--sage);
  }
  .rack-option > .icon { color: var(--sage); }
  .rack-option .body { display: flex; flex-direction: column; min-width: 0; }
  .rack-option .name { font-size: var(--fs-callout); line-height: var(--lh-callout); font-weight: 600; }
  .rack-option .meta { color: var(--muted); font-size: var(--fs-foot); line-height: var(--lh-foot); }

  #return-card { background: var(--sage-tint); border-color: transparent; gap: 0; }
  #return-card > header,

    display: grid;
    grid-template-columns: 32px minmax(0, 1fr);
    align-items: center;
    column-gap: var(--s-3);

  #return-card > header > span:first-child {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--sage-dark);

  #return-card header > span:last-child { display: flex; flex-direction: column; gap: var(--s-1); }
  #return-card > header { padding-bottom: var(--s-3); }
  #return-card .row { min-height: var(--touch); padding: var(--s-3) 0; }
  #return-card .row > .icon { justify-self: center; color: var(--sage); }
  #return-card .divider { margin-left: 44px; }
  #confirmed { padding-top: var(--s-6); text-align: center; align-items: center; }
  #confirmed-mark { width: 64px; height: 64px; }
  #confirmed-mark .icon { width: 32px; height: 32px; }
  #confirmed .t-body { color: var(--muted); }
  #confirmed-summary { width: 100%; text-align: left; margin-top: var(--s-2); }

  .actionbar .price small { margin-top: 2px; }
  @media (hover: hover) and (pointer: fine) {

    .map-pin:hover { z-index: 5; }
    .map-pin:hover .pin-shape { transform: rotate(-45deg) scale(1.18); }

    .rack-option:hover { background: var(--mist); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .segmented::before { transition: transform var(--t-base) var(--ease-glide); }
    .pin-shape { transition: transform var(--t-quick) var(--ease-glide); }
    #rack-picker:not([hidden]) .map:not(.is-expanded):not(.has-opened) { animation: map-arrive var(--t-base) var(--ease-glide) both; }

    .map.is-expanded { transition: top var(--t-slow) var(--ease-glide), left var(--t-slow) var(--ease-glide), width var(--t-slow) var(--ease-glide), height var(--t-slow) var(--ease-glide), border-radius var(--t-slow) var(--ease-glide), box-shadow var(--t-base) var(--ease-glide); }
    .map-recenter { transition: opacity var(--t-base) var(--ease-glide), transform var(--t-base) var(--ease-glide), background var(--t-quick) var(--ease-glide); }
    .map-scene.is-recentering { transition: transform 440ms var(--ease-glide); }
    .map-scene.is-opening { transition: transform var(--t-slow) var(--ease-glide); }
    .map-scene.is-following { transition: transform var(--t-slow) var(--ease-glide); }
    .map.is-recentering .location-dot { animation: location-pulse 680ms var(--ease-glide) both; }
    .map-backdrop { transition: opacity var(--t-base) var(--ease-glide); }
    .fullscreen-map { transition: opacity var(--t-quick) var(--ease-glide); }
    .rack-option { transition: transform var(--t-quick) var(--ease-glide); }
    .fullscreen-rack { transition: background-color var(--t-quick) var(--ease-glide), transform var(--t-quick) var(--ease-glide); }
    .rack-option:focus-visible { transform: translateX(4px); }
    #return-card > * { animation: detail-arrive var(--t-quick) var(--ease-glide) both; }
    #return-card > :nth-child(n + 2) { animation-delay: 40ms; }
    @keyframes map-arrive { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: scale(1); } }
    @keyframes location-pulse { 0% { box-shadow: 0 0 0 0 #4285f444, 0 2px 8px #33557755; } 65% { box-shadow: 0 0 0 27px #4285f41c, 0 2px 8px #33557755; } 100% { box-shadow: 0 0 0 18px #4285f426, 0 2px 8px #33557755; } }
    @keyframes pin-arrive { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes detail-arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  }
  @media (prefers-reduced-motion: no-preference) and (hover: hover) and (pointer: fine) {
    .rack-option:hover { transform: translateX(4px); }
  }
  @media (max-width: 360px) {
    .content { padding-left: var(--s-4); padding-right: var(--s-4); }
    .actionbar { left: var(--s-2); right: var(--s-2); }
    .actionbar .btn { padding-left: var(--s-4); padding-right: var(--s-4); }
  }
</style>

<script>
const homePanel = document.getElementById("home-panel");
const rackPicker = document.getElementById("rack-picker");
const returnCard = document.getElementById("return-card");
const confirmLink = document.getElementById("confirm");
const actionTitle = document.getElementById("action-title");
const actionNote = document.getElementById("action-note");
const choiceActions = document.getElementById("choice-actions");
const confirmedActions = document.getElementById("confirmed-actions");
const confirmedDescription = document.getElementById("confirmed-description");
const confirmedSummary = document.getElementById("confirmed-summary");
const confirmedTitle = document.getElementById("confirmed-title");
const scroller = document.getElementById("scroller");
const radios = [...document.querySelectorAll("[data-method]")];
const pins = [...document.querySelectorAll("[data-map-rack]")];
const rackOptions = [...document.querySelectorAll("[data-rack-choice]")];
const fullRackOptions = [...document.querySelectorAll("[data-full-rack]")];
const methodSwitch = document.querySelector(".segmented");
const viewMapButton = document.getElementById("view-map");
const fullMap = document.getElementById("full-map");
const closeMapButton = document.getElementById("close-map");
const mapBackdrop = document.getElementById("map-backdrop");
const recenterButton = document.getElementById("recenter-map");
const mapElement = rackPicker.querySelector(".map");
const mapCanvas = mapElement.querySelector(".map-canvas");
const mapScene = mapElement.querySelector(".map-scene");
const phoneScreen = document.querySelector(".screen");
const mapPlaceholder = document.createElement("div");
mapPlaceholder.className = "map-placeholder";
let mapReturnTimer;
let mapCloseTimer;
let mapOpenTimer;
let mapControlsTimer;
let mapPulseTimer;
let mapAnchorTimer;
let mapPanX = -150;
let mapPanY = -260;
let mapZoom = .72;
let mapAnchorPanYMax = 0;
let mapDrag = null;
let mapPreviewState = null;
let selectedMethod = "home";
let selectedRack = "a";

function updateMapScene(width = mapElement.clientWidth, height = mapElement.clientHeight) {
  mapPanX = Math.min(0, Math.max(width - 900 * mapZoom, mapPanX));
  const maxPanY = mapElement.classList.contains("is-expanded") ? mapAnchorPanYMax : 0;
  mapPanY = Math.min(maxPanY, Math.max(height - 1700 * mapZoom, mapPanY));
  mapScene.style.setProperty("--pan-x", `${mapPanX}px`);
  mapScene.style.setProperty("--pan-y", `${mapPanY}px`);
  mapScene.style.setProperty("--map-zoom", mapZoom);
}

function centerMapAt(width, height) {
  mapPanX = width / 2 - 418 * mapZoom;
  mapPanY = height / 2 - 538 * mapZoom;
  updateMapScene(width, height);
}

function recenterMap() {
  if (mapElement.classList.contains("is-returning")) return;
  clearTimeout(mapPulseTimer);
  mapScene.classList.remove("is-following");
  mapScene.classList.add("is-recentering");
  mapElement.classList.remove("is-recentering");
  void mapElement.offsetWidth;
  mapElement.classList.add("is-recentering");
  centerMapAt(mapElement.clientWidth, mapElement.clientHeight);
  mapPulseTimer = setTimeout(() => {
    mapScene.classList.remove("is-recentering");
    mapElement.classList.remove("is-recentering");
  }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 680);
}

function zoomMap(nextZoom, clientX, clientY) {
  const next = Math.max(.6, Math.min(1.6, nextZoom));
  const bounds = mapElement.getBoundingClientRect();
  const x = clientX - bounds.left;
  const y = clientY - bounds.top;
  mapPanX = x - (x - mapPanX) * next / mapZoom;
  mapPanY = y - (y - mapPanY) * next / mapZoom;
  mapZoom = next;
  updateMapScene();
}

const racks = {
  a: { short: "Rack A", name: "Rack A · Blk 118", distance: "300 m away" },
  b: { short: "Rack B", name: "Rack B · Park entrance", distance: "450 m away" },
  c: { short: "Rack C", name: "Rack C · MRT exit", distance: "600 m away" }
};

homePanel.innerHTML = `
  <header>
    <span><svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-house"/></svg></span>
    <span><span class="t-title">Home Collection</span><span class="t-foot">Collected from your home</span></span>
  </header>
  <hr class="divider">
  <div class="row">
    <svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-clock"/></svg>
    <span class="body"><span class="meta">Collection window</span><span class="name num">5–7 pm</span></span>
  </div>`;

const confirmedPlan = (method, rack) => method === "home" ? `
  <div class="row">
    <svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-house"/></svg>
    <span class="body"><span class="meta">Collection from</span><span class="name">Your home</span></span>
  </div>
  <hr class="divider">
  <div class="row">
    <svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-clock"/></svg>
    <span class="body"><span class="meta">Collection window</span><span class="name num">5–7 pm</span></span>
  </div>
  <hr class="divider">
  <div class="row">
    <svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-bicycle"/></svg>
    <span class="body"><span class="meta">Return to your home · included</span><span class="name">Within 2 days</span></span>
  </div>` : `
  <div class="row">
    <svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-map-pin"/></svg>
    <span class="body"><span class="meta">Drop-off</span><span class="name">${racks[rack].name}</span></span>
  </div>
  <hr class="divider">
  <div class="row">
    <svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-truck"/></svg>
    <span class="body"><span class="meta">Courier pickup</span><span class="name num">Sat 25 Oct · 8:30 am</span></span>
  </div>
  <hr class="divider">
  <div class="row">
    <svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-clock"/></svg>
    <span class="body"><span class="meta">Return to ${racks[rack].short} · included</span><span class="name num">8–10 am · within 24 hours</span></span>
  </div>`;

const returnPlan = (method, rack) => `
  <header>
    <span><svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-bicycle"/></svg></span>
    <span><span class="t-title">Your Bike’s Return</span><span class="t-foot">Included in your total</span></span>
  </header>
  <hr class="divider">
  <div class="row">
    <svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-${method === "home" ? "house" : "map-pin"}"/></svg>
    <span class="body"><span class="meta">Returns to</span><span class="name">${method === "home" ? "Your home" : rack ? racks[rack].short : "Your chosen rack"}</span></span>
  </div>
  <hr class="divider">
  <div class="row">
    <svg class="icon" aria-hidden="true"><use href="../../../../design/icons.svg#i-clock"/></svg>
    <span class="body"><span class="meta">${method === "home" ? "Return timing" : "Return window"}</span><span class="name ${method === "home" ? "" : "num"}">${method === "home" ? "Within 2 days" : "8–10 am"}</span>${method === "home" ? "" : `<span class="meta">Within 24 hours</span>`}</span>
  </div>`;

function render() {
  const state = location.hash.slice(1) || "home";
  const confirmed = state === "confirmed";
  document.querySelectorAll("[data-state]").forEach((section) => {
    section.hidden = section.dataset.state !== (confirmed ? "confirmed" : "choice");
  });
  choiceActions.hidden = confirmed;
  confirmedActions.hidden = !confirmed;
  if (confirmed) {
    confirmedDescription.textContent = selectedMethod === "home"
      ? "We’ll collect your bike from home during the 5–7 pm window and notify you at each handoff."
      : "Drop it at the rack before the courier arrives. We’ll notify you at each handoff.";
    confirmedSummary.innerHTML = confirmedPlan(selectedMethod, selectedRack);
    scroller.scrollTop = 0;
    confirmedTitle.focus({ preventScroll: true });
    return;
  }

  const method = state.startsWith("rack") ? "rack" : "home";
  const requestedRack = state.startsWith("rack-") ? state.slice(5) : "";
  const rack = Object.hasOwn(racks, requestedRack) ? requestedRack : "";
  selectedMethod = method;
  if (rack) selectedRack = rack;
  radios.forEach((radio) => {
    const selected = radio.dataset.method === method;
    radio.setAttribute("aria-checked", String(selected));
    radio.tabIndex = selected ? 0 : -1;
  });
  pins.forEach((pin) => pin.setAttribute("aria-pressed", String(pin.dataset.mapRack === rack)));
  rackOptions.forEach((option) => option.setAttribute("aria-pressed", String(option.dataset.rackChoice === rack)));
  fullRackOptions.forEach((option) => option.setAttribute("aria-pressed", String(option.dataset.fullRack === rack)));
  methodSwitch.dataset.selected = method;
  homePanel.hidden = method !== "home";
  rackPicker.hidden = method !== "rack";
  returnCard.innerHTML = returnPlan(method, rack);
  const canConfirm = method === "home" || Boolean(rack);
  confirmLink.setAttribute("aria-disabled", String(!canConfirm));
  confirmLink.href = canConfirm ? "#confirmed" : "#rack";
  actionTitle.textContent = method === "home" ? "Home · 5–7 pm" : rack ? `${racks[rack].short} · Sat 8:30 am` : "Choose a rack";
  actionNote.textContent = method === "home" ? "Return home · within 2 days" : rack ? `Return to ${racks[rack].short} · 8–10 am` : "Return to chosen rack · 8–10 am";
}

function openMap() {
  if (mapElement.classList.contains("is-expanded")) return;
  clearTimeout(mapOpenTimer);
  clearTimeout(mapControlsTimer);
  clearTimeout(mapReturnTimer);
  clearTimeout(mapCloseTimer);
  clearTimeout(mapPulseTimer);
  clearTimeout(mapAnchorTimer);
  mapScene.classList.remove("is-recentering", "is-following");
  mapElement.classList.remove("is-recentering");
  mapElement.classList.add("has-opened");
  const preview = mapElement.getBoundingClientRect();
  const locationRect = mapElement.querySelector(".location-dot").getBoundingClientRect();
  const locationX = locationRect.left + locationRect.width / 2;
  const locationY = locationRect.top + locationRect.height / 2;
  const phone = phoneScreen.getBoundingClientRect();
  mapPreviewState = {
    panX: mapPanX,
    panY: mapPanY,
    zoom: mapZoom,
    locationX,
    locationY,
    width: preview.width,
    height: preview.height
  };
  const anchoredPanX = locationX - phone.left - 418 * mapZoom;
  const anchoredPanY = locationY - phone.top - 538 * mapZoom;
  mapAnchorPanYMax = Math.max(0, anchoredPanY);
  for (const target of [mapElement, fullMap, mapBackdrop]) {
    target.style.setProperty("--phone-top", `${phone.top}px`);
    target.style.setProperty("--phone-left", `${phone.left}px`);
    target.style.setProperty("--phone-width", `${phone.width}px`);
    target.style.setProperty("--phone-height", `${phone.height}px`);
  }
  mapElement.style.setProperty("--preview-top", `${preview.top}px`);
  mapElement.style.setProperty("--preview-left", `${preview.left}px`);
  mapElement.style.setProperty("--preview-width", `${preview.width}px`);
  mapElement.style.setProperty("--preview-height", `${preview.height}px`);
  mapElement.before(mapPlaceholder);
  phoneScreen.appendChild(mapElement);
  mapElement.classList.add("is-expanded");
  mapBackdrop.classList.add("is-visible");
  fullMap.setAttribute("aria-hidden", "false");
  fullMap.inert = false;
  scroller.inert = true;
  choiceActions.inert = true;
  document.body.style.overflow = "hidden";
  mapCanvas.tabIndex = 0;
  mapCanvas.setAttribute("aria-label", "Map: drag to explore, scroll to zoom, or use arrow keys and plus and minus");
  updateMapScene();
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  mapOpenTimer = setTimeout(() => {
    mapScene.classList.add("is-opening");
    mapElement.classList.add("is-ready");
    mapPanX = anchoredPanX;
    mapPanY = anchoredPanY;
    updateMapScene(phone.width, phone.height);
  }, reduceMotion ? 0 : 32);
  mapAnchorTimer = setTimeout(() => {
    mapScene.classList.remove("is-opening");
  }, reduceMotion ? 0 : 600);
  mapControlsTimer = setTimeout(() => {
    fullMap.classList.add("is-open");
    closeMapButton.focus();
  }, reduceMotion ? 0 : 380);
}

function closeMap() {
  if (!mapElement.classList.contains("is-ready") || mapElement.classList.contains("is-returning")) return;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const preview = mapPreviewState;
  clearTimeout(mapControlsTimer);
  clearTimeout(mapPulseTimer);
  clearTimeout(mapAnchorTimer);
  mapScene.classList.remove("is-opening");
  mapElement.classList.add("is-returning");
  fullMap.classList.remove("is-open");
  fullMap.setAttribute("aria-hidden", "true");
  fullMap.inert = true;
  mapScene.classList.remove("is-following");
  mapScene.classList.add("is-recentering");
  mapElement.classList.add("is-recentering");
  const frame = mapElement.getBoundingClientRect();
  const returnPanX = preview.locationX - frame.left - 418 * preview.zoom;
  const returnPanY = preview.locationY - frame.top - 538 * preview.zoom;
  const needsReturn = Math.abs(mapPanX - returnPanX) > .5 || Math.abs(mapPanY - returnPanY) > .5 || Math.abs(mapZoom - preview.zoom) > .001;
  mapZoom = preview.zoom;
  mapPanX = returnPanX;
  mapPanY = returnPanY;
  updateMapScene();
  mapReturnTimer = setTimeout(() => {
    mapElement.classList.remove("is-ready");
    mapScene.classList.remove("is-recentering");
    mapScene.classList.add("is-following");
    mapPanX = preview.panX;
    mapPanY = preview.panY;
    updateMapScene(preview.width, preview.height);
    mapBackdrop.classList.remove("is-visible");
    mapCloseTimer = setTimeout(() => {
      mapPlaceholder.replaceWith(mapElement);
      mapElement.classList.remove("is-expanded", "is-returning", "is-recentering");
      mapScene.classList.remove("is-following");
      mapAnchorPanYMax = 0;
      mapPreviewState = null;
      mapCanvas.tabIndex = -1;
      mapCanvas.setAttribute("aria-label", "Map preview with three nearby racks");
      document.body.style.overflow = "";
      scroller.inert = false;
      choiceActions.inert = false;
      updateMapScene();
      viewMapButton.focus();
    }, reduceMotion ? 0 : 560);
  }, reduceMotion || !needsReturn ? 0 : 460);
}

mapCanvas.addEventListener("pointerdown", (event) => {
  if (!mapElement.classList.contains("is-ready") || mapElement.classList.contains("is-returning") || event.target.closest(".map-pin")) return;
  mapDrag = { id: event.pointerId, x: event.clientX, y: event.clientY, panX: mapPanX, panY: mapPanY };
  mapCanvas.setPointerCapture(event.pointerId);
  mapCanvas.classList.add("is-dragging");
  event.preventDefault();
});
mapCanvas.addEventListener("pointermove", (event) => {
  if (!mapDrag || mapDrag.id !== event.pointerId) return;
  mapPanX = mapDrag.panX + event.clientX - mapDrag.x;
  mapPanY = mapDrag.panY + event.clientY - mapDrag.y;
  updateMapScene();
});
function endMapDrag(event) {
  if (!mapDrag || mapDrag.id !== event.pointerId) return;
  mapDrag = null;
  mapCanvas.classList.remove("is-dragging");
}
mapCanvas.addEventListener("pointerup", endMapDrag);
mapCanvas.addEventListener("pointercancel", endMapDrag);
mapCanvas.addEventListener("wheel", (event) => {
  if (!mapElement.classList.contains("is-ready") || mapElement.classList.contains("is-returning")) return;
  event.preventDefault();
  zoomMap(mapZoom - event.deltaY * .001, event.clientX, event.clientY);
}, { passive: false });
mapCanvas.addEventListener("keydown", (event) => {
  if (!mapElement.classList.contains("is-ready") || mapElement.classList.contains("is-returning")) return;
  const move = { ArrowLeft: [40, 0], ArrowRight: [-40, 0], ArrowUp: [0, 40], ArrowDown: [0, -40] }[event.key];
  if (move) {
    event.preventDefault();
    mapPanX += move[0];
    mapPanY += move[1];
    updateMapScene();
  } else if (event.key === "+" || event.key === "=") {
    event.preventDefault();
    const rect = mapElement.getBoundingClientRect();
    zoomMap(mapZoom + .1, rect.left + rect.width / 2, rect.top + rect.height / 2);
  } else if (event.key === "-") {
    event.preventDefault();
    const rect = mapElement.getBoundingClientRect();
    zoomMap(mapZoom - .1, rect.left + rect.width / 2, rect.top + rect.height / 2);
  }
});

radios.forEach((radio) => radio.addEventListener("click", () => {
  location.hash = radio.dataset.method;
}));
methodSwitch.addEventListener("keydown", (event) => {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
  event.preventDefault();
  const current = radios.findIndex((radio) => radio.getAttribute("aria-checked") === "true");
  const next = event.key === "Home" ? 0 : event.key === "End" ? radios.length - 1
    : (current + (event.key === "ArrowRight" ? 1 : -1) + radios.length) % radios.length;
  location.hash = radios[next].dataset.method;
  radios[next].focus();
});
function toggleRack(rack) {
  location.hash = location.hash === `#rack-${rack}` ? "rack" : `rack-${rack}`;
}
pins.forEach((pin) => pin.addEventListener("click", () => {
  toggleRack(pin.dataset.mapRack);
}));
viewMapButton.addEventListener("click", openMap);
recenterButton.addEventListener("click", recenterMap);
closeMapButton.addEventListener("click", closeMap);
fullRackOptions.forEach((option) => option.addEventListener("click", () => {
  toggleRack(option.dataset.fullRack);
}));
fullRackOptions.forEach((option) => {
  const pin = document.querySelector(`[data-map-rack="${option.dataset.fullRack}"]`);
  option.addEventListener("pointerenter", () => pin?.classList.add("is-preview"));
  option.addEventListener("pointerleave", () => pin?.classList.remove("is-preview"));
  option.addEventListener("focus", () => pin?.classList.add("is-preview"));
  option.addEventListener("blur", () => pin?.classList.remove("is-preview"));
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && mapElement.classList.contains("is-ready")) closeMap();
  if (event.key !== "Tab" || !mapElement.classList.contains("is-ready") || mapElement.classList.contains("is-returning")) return;
  const focusables = [closeMapButton, ...fullRackOptions, mapCanvas, ...pins, recenterButton];
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  } else if (!focusables.includes(document.activeElement)) {
    event.preventDefault();
    first.focus();
  }
});
rackOptions.forEach((option) => {
  const showPin = () => document.querySelector(`[data-map-rack="${option.dataset.rackChoice}"]`)?.classList.add("is-preview");
  const hidePin = () => document.querySelector(`[data-map-rack="${option.dataset.rackChoice}"]`)?.classList.remove("is-preview");
  option.addEventListener("pointerenter", showPin);
  option.addEventListener("pointerleave", hidePin);
  option.addEventListener("focus", showPin);
  option.addEventListener("blur", hidePin);
  option.addEventListener("click", () => {
    toggleRack(option.dataset.rackChoice);
  });
});
confirmLink.addEventListener("click", (event) => {
  if (confirmLink.getAttribute("aria-disabled") === "true") event.preventDefault();
});
addEventListener("hashchange", render);
render();
if (new URLSearchParams(location.search).get("view") === "map") {
  location.hash = "rack";
  render();
  requestAnimationFrame(openMap);
}
</script>
</body>
</html>
